name = "replace-with-app-push-worker"
main = "worker.js"
compatibility_date = "2026-06-29"
preview_urls = false

[observability]
enabled = true

[observability.logs]
enabled = true

[vars]
APP_ID = "replace-with-app-id"
APP_PATH = "/replace-with-app-path/"
ALLOWED_ORIGIN = "https://replace-with-your-origin.example"
VAPID_PUBLIC_KEY = "replace-with-public-key"
VAPID_SUBJECT = "mailto:replace-with-contact@example.com"

[[kv_namespaces]]
binding = "PUSH_STORE"
id = "replace-with-kv-namespace-id"

[triggers]
crons = ["* * * * *"]
