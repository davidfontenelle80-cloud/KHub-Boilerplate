<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="KHub App" />
  <meta name="theme-color" content="#1a73e8" />

  <!-- PWA -->
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />

  <!-- CSS -->
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/dark-mode.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/responsive.css" />

  <title>KHub App</title>
</head>
<body>

  <!-- Skip nav for accessibility -->
  <a class="skip-link" href="#main-content">Skip to main content</a>

  <!-- App header -->
  <header class="app-header" role="banner">
    <h1 class="app-title">KHub App</h1>
    <div class="header-controls">
      <button id="lang-toggle" class="btn btn-icon" aria-label="Toggle language">EN</button>
      <button id="theme-toggle" class="btn btn-icon" aria-label="Toggle dark mode">🌙</button>
    </div>
  </header>

  <!-- Error boundary display (hidden by default) -->
  <div id="error-boundary" class="error-boundary" role="alert" aria-live="assertive" hidden>
    <p id="error-message"></p>
    <button class="btn btn-primary" onclick="KHub.ErrorBoundary.dismiss()">Dismiss</button>
  </div>

  <!-- Update notice (shown by service worker) -->
  <div id="update-notice" class="update-notice" role="status" aria-live="polite" hidden>
    <span data-i18n="updateAvailable">Update available</span>
    <button class="btn btn-sm" onclick="KHub.SW.applyUpdate()">Refresh</button>
  </div>

  <!-- Main content area -->
  <main id="main-content" class="app-main" role="main">
    <div id="app-view" class="app-view">
      <!-- Views injected here by router -->
      <section class="welcome-screen">
        <h2 data-i18n="welcome">Welcome to KHub</h2>
        <p data-i18n="welcomeSub">Your app starts here.</p>
        <button class="btn btn-primary" data-i18n="getStarted">Get Started</button>
      </section>
    </div>
  </main>

  <!-- Bottom nav (optional — remove if this app has no tabs) -->
  <nav class="bottom-nav" role="navigation" aria-label="Main navigation" hidden>
    <!-- Tabs injected by app.js -->
  </nav>

  <!-- JS — load order matters: config → shared → features → bootstrap -->
  <script src="js/config.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/error-boundary.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/components/button.js"></script>
  <script src="js/components/modal.js"></script>
  <script src="js/components/card.js"></script>
  <script src="js/components/input.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
